[project]
name = "lab-operador"
version = "0.1.0"
description = "Lab Operador — Claude Build Day (Ibero)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "itsdangerous>=2.2",
    "strands-agents[anthropic,ollama]>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "asgi-lifespan>=2.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    # WS-5: guion de aceptación contra el modelo real. Se corre a mano con RUN_LLM_TESTS=1.
    "llm: llama a la API de Anthropic (cuesta y necesita red)",
]

[tool.uv]
package = false
